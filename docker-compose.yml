services:
  postgres:
    image: postgres:16-alpine
    container_name: deckdeal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deckdeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kYuHmB836y%6CGyx}
      POSTGRES_DB: ${POSTGRES_DB:-deckdeal_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deckdeal} -d ${POSTGRES_DB:-deckdeal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
